name: Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*', 'v*']
    branches: [main]
    paths: ['backend/**', 'windows/**', 'scripts/test_backend.py', 'scripts/test_performance.py', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Test performance sampling
        run: python scripts/test_performance.py
      - name: Test Windows API and process lifecycle
        run: python scripts/test_backend.py
      - name: Test file browser and terminal scrollback
        shell: pwsh
        run: |
          python windows/test_files.py
          if ($LASTEXITCODE -ne 0) { throw 'File browser tests failed' }
          python windows/test_terminal_scroll.py
          if ($LASTEXITCODE -ne 0) { throw 'Terminal scrollback tests failed' }
      - name: Render Fluent UI at 100 and 150 percent
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR = '1'
          $env:LOCALDECK_UI_OUTPUT = 'dist/windows-preview/100'
          python windows/test_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'UI render failed' }
          $env:QT_SCALE_FACTOR = '1.5'
          $env:LOCALDECK_UI_OUTPUT = 'dist/windows-preview/150'
          python windows/test_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'High-DPI UI render failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-11-UI-preview
          path: dist/windows-preview/
      - name: Test desktop UI
        shell: pwsh
        run: |
          $env:LOCALDECK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'localdeck-ui-source'
          python windows/app.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop source smoke test failed' }
          $result = Get-Content "$env:LOCALDECK_DATA_DIR/smoke-result.json" | ConvertFrom-Json
          if (-not $result.ok) { throw 'UI did not connect to API' }
      - name: Test terminal tabs and background continuity
        shell: pwsh
        run: |
          $env:LOCALDECK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'localdeck-terminal-source'
          python windows/app.py --terminal-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Terminal source tests failed' }
          $result = Get-Content "$env:LOCALDECK_DATA_DIR/terminal-smoke-result.json" | ConvertFrom-Json
          if (-not $result.ok) { throw 'Terminal continuity test failed' }
      - name: Build standalone EXE and ZIP
        shell: pwsh
        run: ./windows/build.ps1
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $env:LOCALDECK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'localdeck-ui-exe'
          $app = Start-Process dist/windows/LocalDeck.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'EXE smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "EXE failed: $($app.ExitCode)" }
          $result = Get-Content "$env:LOCALDECK_DATA_DIR/smoke-result.json" | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged UI did not connect to API' }
      - name: Test packaged terminal tabs
        shell: pwsh
        run: |
          $env:LOCALDECK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'localdeck-terminal-exe'
          $app = Start-Process dist/windows/LocalDeck.exe -ArgumentList '--terminal-smoke-test' -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Terminal EXE test timed out' }
          if ($app.ExitCode -ne 0) { throw "Terminal EXE failed: $($app.ExitCode)" }
          $result = Get-Content "$env:LOCALDECK_DATA_DIR/terminal-smoke-result.json" | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged terminal tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalDeck-Windows-x64
          path: |
            dist/LocalDeck-0.5.0-Windows-x64.exe
            dist/LocalDeck-0.5.0-Windows-x64.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --title 'LocalDeck 0.5.0 · macOS & Windows 11' --notes-file RELEASE.md dist/LocalDeck-0.5.0-Windows-x64.exe dist/LocalDeck-0.5.0-Windows-x64.zip dist/SHA256SUMS-Windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
