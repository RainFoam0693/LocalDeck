name: macOS desktop
on:
  push:
    tags: ['macos-v1.0.0']
permissions:
  contents: write
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package LocalDeck
        run: ./scripts/package.sh
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title 'LocalDeck 1.0.0 · macOS' --notes-file RELEASE.md dist/LocalDeck-1.0.0-macOS-arm64.dmg dist/LocalDeck-1.0.0-macOS-arm64.zip dist/SHA256SUMS-macOS.txt
